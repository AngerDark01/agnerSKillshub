<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Skill Hub Manager</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2528;
        --muted: #657176;
        --line: #d9ded8;
        --paper: #f8f7f1;
        --panel: #ffffff;
        --mist: #eef2ee;
        --blue: #315f8c;
        --green: #2e7d5b;
        --red: #b4473e;
        --amber: #a56b12;
        --shadow: 0 18px 48px rgba(42, 52, 44, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Aptos", "Segoe UI", "Noto Sans CJK SC", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(29, 37, 40, 0.045) 1px, transparent 1px),
          linear-gradient(0deg, rgba(29, 37, 40, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        min-height: 36px;
      }

      button:hover { border-color: #aab6ae; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }

      .app {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }

      aside {
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(14px);
        padding: 20px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }

      main {
        padding: 22px 28px 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 12px;
        color: var(--muted);
        background: var(--panel);
        white-space: nowrap;
      }

      .folder-form {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .folder-form label,
      .move-panel label {
        font-size: 12px;
        color: var(--muted);
      }

      .folder-form input,
      .toolbar input,
      .move-panel select {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
      }

      .primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .sync {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }

      .danger {
        color: var(--red);
      }

      .folders {
        display: grid;
        gap: 4px;
      }

      .folder {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 8px 9px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        text-align: left;
      }

      .folder.active,
      .folder.drag-over {
        border-color: #9ab4a6;
        background: #eaf3ed;
      }

      .folder span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .count {
        color: var(--muted);
        font-size: 12px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .title-block h2 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: 0;
      }

      .title-block p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(180px, 320px) auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }

      .move-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px auto;
        gap: 10px;
        align-items: end;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        margin-bottom: 14px;
      }

      .table {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .row,
      .head {
        display: grid;
        grid-template-columns: minmax(180px, 1.1fr) minmax(160px, 0.9fr) minmax(240px, 1.4fr);
        gap: 14px;
        align-items: center;
        padding: 12px 14px;
      }

      .head {
        background: var(--mist);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .row {
        border-top: 1px solid var(--line);
        cursor: grab;
      }

      .row:hover,
      .row.selected {
        background: #f5f8f5;
      }

      .name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .path,
      .desc {
        color: var(--muted);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .path {
        font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        max-width: min(560px, calc(100vw - 36px));
        border: 1px solid var(--line);
        border-left: 5px solid var(--green);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 12px 14px;
        display: none;
        white-space: pre-wrap;
      }

      .toast.show { display: block; }
      .toast.error { border-left-color: var(--red); }
      .toast.warn { border-left-color: var(--amber); }

      pre {
        max-height: 180px;
        overflow: auto;
        margin: 8px 0 0;
        padding: 10px;
        border-radius: 6px;
        background: #172023;
        color: #e6efe8;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; }
        aside { position: static; height: auto; }
        .topbar,
        .toolbar,
        .move-panel,
        .row,
        .head {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <h1>Skill Hub Manager</h1>
          <span class="pill" id="skillCount">0 skills</span>
        </div>

        <form class="folder-form" id="folderForm">
          <label for="folderInput">新建分类文件夹</label>
          <input id="folderInput" placeholder="例如 14-my-workflow 或 frontend/react" autocomplete="off" />
          <button class="primary" type="submit">新建</button>
        </form>

        <div class="folders" id="folders"></div>
      </aside>

      <main>
        <div class="topbar">
          <div class="title-block">
            <h2 id="currentTitle">全部 Skills</h2>
            <p id="rootPath"></p>
          </div>
          <button id="refreshBtn">刷新</button>
          <button class="sync" id="syncBtn">同步到 Codex</button>
        </div>

        <div class="toolbar">
          <input id="searchInput" placeholder="搜索 skill 名称、描述或路径" />
          <span class="pill" id="statusText">未同步状态</span>
        </div>

        <section class="move-panel">
          <div>
            <label>选中的 skill</label>
            <div class="name" id="selectedSkill">未选择</div>
            <div class="path" id="selectedPath"></div>
          </div>
          <div>
            <label for="targetSelect">移动到</label>
            <select id="targetSelect"></select>
          </div>
          <button class="primary" id="moveBtn" disabled>移动</button>
        </section>

        <section class="table" aria-label="Skills">
          <div class="head">
            <div>Skill</div>
            <div>当前分类</div>
            <div>描述</div>
          </div>
          <div id="rows"></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const state = {
        skills: [],
        categories: [],
        selectedFolder: null,
        selectedSkill: null,
        search: '',
      };

      const $ = (id) => document.getElementById(id);

      async function api(path, options) {
        const res = await fetch(path, {
          headers: { 'content-type': 'application/json' },
          ...options,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        return data;
      }

      function toast(message, type = 'ok') {
        const el = $('toast');
        el.className = `toast show ${type === 'error' ? 'error' : type === 'warn' ? 'warn' : ''}`;
        el.textContent = message;
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => el.classList.remove('show'), 5200);
      }

      function labelForFolder(path) {
        if (!path) return '(root)';
        return path;
      }

      function filteredSkills() {
        const q = state.search.trim().toLowerCase();
        return state.skills.filter((skill) => {
          const inFolder = state.selectedFolder === null || skill.category === state.selectedFolder;
          if (!inFolder) return false;
          if (!q) return true;
          return [skill.name, skill.description, skill.relPath, skill.category]
            .join(' ')
            .toLowerCase()
            .includes(q);
        });
      }

      function renderFolders() {
        const root = $('folders');
        root.innerHTML = '';
        const all = document.createElement('button');
        all.className = `folder ${state.selectedFolder === null ? 'active' : ''}`;
        all.innerHTML = `<span>全部</span><span class="count">${state.skills.length}</span>`;
        all.onclick = () => {
          state.selectedFolder = null;
          render();
        };
        root.appendChild(all);

        for (const category of state.categories) {
          const btn = document.createElement('button');
          btn.className = `folder ${state.selectedFolder === category.path ? 'active' : ''}`;
          btn.dataset.folder = category.path;
          btn.innerHTML = `<span>${labelForFolder(category.path)}</span><span class="count">${category.count}</span>`;
          btn.onclick = () => {
            state.selectedFolder = category.path;
            render();
          };
          btn.ondragover = (event) => {
            event.preventDefault();
            btn.classList.add('drag-over');
          };
          btn.ondragleave = () => btn.classList.remove('drag-over');
          btn.ondrop = async (event) => {
            event.preventDefault();
            btn.classList.remove('drag-over');
            const skillPath = event.dataTransfer.getData('text/plain');
            await moveSkill(skillPath, category.path);
          };
          root.appendChild(btn);
        }
      }

      function renderTargets() {
        const select = $('targetSelect');
        select.innerHTML = '';
        for (const category of state.categories) {
          const option = document.createElement('option');
          option.value = category.path;
          option.textContent = labelForFolder(category.path);
          select.appendChild(option);
        }
      }

      function renderRows() {
        const root = $('rows');
        root.innerHTML = '';
        const skills = filteredSkills();
        if (skills.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'row';
          empty.innerHTML = '<div class="muted">没有匹配的 skill</div><div></div><div></div>';
          root.appendChild(empty);
          return;
        }

        for (const skill of skills) {
          const row = document.createElement('div');
          row.className = `row ${state.selectedSkill?.relPath === skill.relPath ? 'selected' : ''}`;
          row.draggable = true;
          row.innerHTML = `
            <div>
              <div class="name">${skill.name}</div>
              <div class="path">${skill.relPath}</div>
            </div>
            <div class="path">${labelForFolder(skill.category)}</div>
            <div class="desc">${skill.description || '无描述'}</div>
          `;
          row.onclick = () => {
            state.selectedSkill = skill;
            render();
          };
          row.ondragstart = (event) => {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', skill.relPath);
          };
          root.appendChild(row);
        }
      }

      function renderSelection() {
        const selected = state.selectedSkill;
        $('selectedSkill').textContent = selected ? selected.name : '未选择';
        $('selectedPath').textContent = selected ? selected.relPath : '';
        $('moveBtn').disabled = !selected;
        if (selected) $('targetSelect').value = selected.category;
      }

      function render() {
        $('skillCount').textContent = `${state.skills.length} skills`;
        $('currentTitle').textContent = state.selectedFolder === null ? '全部 Skills' : labelForFolder(state.selectedFolder);
        renderFolders();
        renderTargets();
        renderRows();
        renderSelection();
      }

      async function refresh() {
        const data = await api('/api/skills');
        state.skills = data.skills;
        state.categories = data.categories;
        $('rootPath').textContent = data.skillsDir;
        if (state.selectedFolder && !state.categories.some((item) => item.path === state.selectedFolder)) {
          state.selectedFolder = null;
        }
        if (state.selectedSkill) {
          state.selectedSkill = state.skills.find((skill) => skill.relPath === state.selectedSkill.relPath) || null;
        }
        render();
      }

      async function createFolder(folder) {
        const data = await api('/api/folders', {
          method: 'POST',
          body: JSON.stringify({ folder }),
        });
        state.skills = data.skills;
        state.categories = data.categories;
        state.selectedFolder = data.folder;
        render();
        toast(`已新建分类：${data.folder}`);
      }

      async function moveSkill(skillPath, targetFolder) {
        const data = await api('/api/move', {
          method: 'POST',
          body: JSON.stringify({ skillPath, targetFolder }),
        });
        state.skills = data.skills;
        state.categories = data.categories;
        state.selectedSkill = state.skills.find((skill) => skill.relPath === data.to) || null;
        state.selectedFolder = targetFolder || '';
        render();
        toast(`已移动：${data.from}\n→ ${data.to}`);
      }

      async function sync() {
        $('syncBtn').disabled = true;
        $('statusText').textContent = '同步中...';
        try {
          const data = await api('/api/sync', { method: 'POST', body: '{}' });
          const output = [data.sync.stdout, data.sync.stderr, data.diff.stdout, data.diff.stderr].filter(Boolean).join('\n');
          $('statusText').textContent = data.sync.code === 0 ? '已同步' : '同步失败';
          toast(`同步完成${output ? `\n\n${output.slice(0, 1200)}` : ''}`);
        } catch (error) {
          $('statusText').textContent = '同步失败';
          toast(error.message, 'error');
        } finally {
          $('syncBtn').disabled = false;
        }
      }

      $('folderForm').onsubmit = async (event) => {
        event.preventDefault();
        const folder = $('folderInput').value;
        if (!folder.trim()) return;
        try {
          await createFolder(folder);
          $('folderInput').value = '';
        } catch (error) {
          toast(error.message, 'error');
        }
      };

      $('searchInput').oninput = (event) => {
        state.search = event.target.value;
        renderRows();
      };

      $('refreshBtn').onclick = () => refresh().catch((error) => toast(error.message, 'error'));
      $('syncBtn').onclick = sync;
      $('moveBtn').onclick = () => {
        if (!state.selectedSkill) return;
        moveSkill(state.selectedSkill.relPath, $('targetSelect').value).catch((error) => toast(error.message, 'error'));
      };

      refresh().catch((error) => toast(error.message, 'error'));
    </script>
  </body>
</html>
